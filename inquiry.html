<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의게시판 · 준스키타운</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#F5F6F8;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;}
  input,textarea{outline:none;font-family:inherit;}
  input:focus,textarea:focus{border-color:#FF6A3D !important;}
</style>
</head>
<body>

<div id="siteHeader"></div>

<main style="max-width:800px;margin:0 auto;padding:28px clamp(16px,4vw,32px) 56px;">
  <div style="margin-bottom:22px;">
    <div style="font-size:12.5px;font-weight:800;letter-spacing:.06em;color:#FF6A3D;text-transform:uppercase;margin-bottom:8px;">INQUIRY</div>
    <h1 style="margin:0 0 8px;font-size:clamp(24px,5vw,30px);font-weight:800;color:#14263F;letter-spacing:-0.02em;">문의게시판</h1>
    <p style="margin:0;font-size:15px;line-height:1.6;color:#4B5563;">숙박, 렌탈, 리프트권 문의를 남기고 답변을 확인하세요.</p>
  </div>
  <div id="app"></div>
</main>

<div id="siteFooter"></div>

<script src="site.js"></script>
<script src="inquiry.js"></script>
</body>
</html>
