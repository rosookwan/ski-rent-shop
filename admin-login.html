<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 로그인 · 준스키타운</title>
<meta name="description" content="준스키타운 운영자 전용 관리자 로그인 화면입니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<div style="background:#14263F;padding:16px clamp(16px,4vw,32px);display:flex;align-items:center;gap:14px;">
  <a href="index.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
    <span style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M2 18.5L7.5 9.5L11.5 18.5Z" fill="#FF6A3D" fill-opacity="0.5"/>
        <path d="M6.5 18.5L14 4.5L22 18.5Z" fill="#FF6A3D"/>
        <path d="M14 4.5L16.1 8.6L11.9 8.6Z" fill="#FFFFFF"/>
        <circle cx="18.7" cy="6.3" r="1.3" fill="#FFFFFF"/>
      </svg>
    </span>
    <span style="color:#FFFFFF;font-weight:800;font-size:15px;white-space:nowrap;">준스키타운 관리자</span>
  </a>
</div>

<div style="min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:48px 20px;">
  <div style="width:min(92vw,380px);background:#FFFFFF;border:1px solid #E6E8EC;border-radius:20px;padding:clamp(26px,5vw,36px);display:flex;flex-direction:column;gap:22px;">
    <div>
      <div style="font-size:12px;font-weight:800;letter-spacing:.06em;color:#FF6A3D;text-transform:uppercase;margin-bottom:8px;">ADMIN LOGIN</div>
      <h1 style="margin:0 0 6px;font-size:22px;font-weight:800;color:#14263F;letter-spacing:-0.02em;">관리자 로그인</h1>
      <p style="margin:0;font-size:13.5px;color:#8A93A1;line-height:1.6;">아이디와 비밀번호를 입력해주세요.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="loginUsername" style="font-size:12.5px;font-weight:700;color:#4B5563;">아이디</label>
        <input id="loginUsername" type="text" placeholder="아이디를 입력하세요" style="padding:13px 14px;border-radius:12px;border:1.5px solid #E6E8EC;font-size:14px;color:#14263F;width:100%;font-family:inherit;" />
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="loginPassword" style="font-size:12.5px;font-weight:700;color:#4B5563;">비밀번호</label>
        <input id="loginPassword" type="password" placeholder="비밀번호를 입력하세요" style="padding:13px 14px;border-radius:12px;border:1.5px solid #E6E8EC;font-size:14px;color:#14263F;width:100%;font-family:inherit;" />
      </div>
    </div>
    <button id="loginBtn" style="padding:14px;border-radius:13px;background:#FF6A3D;color:#FFFFFF;font-weight:800;font-size:15px;border:none;cursor:pointer;font-family:inherit;">로그인</button>
    <a href="index.html" style="text-align:center;font-size:12.5px;color:#8A93A1;font-weight:600;text-decoration:none;">사이트로 돌아가기</a>
  </div>
</div>

<script src="js/store.js"></script>
<script>
  // 프로토타입: 아이디/비밀번호 검증 없이 세션만 생성 (실제 인증은 M3)
  function login() {
    JSTStore.setAdminSession();
    window.location.href = 'admin.html';
  }
  document.getElementById('loginBtn').addEventListener('click', login);
  ['loginUsername', 'loginPassword'].forEach(function (id) {
    document.getElementById(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') login();
    });
  });
</script>
</body>
</html>
