<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준스키타운 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#F5F6F8;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;}
  input,textarea{outline:none;font-family:inherit;}
  input:focus,textarea:focus{border-color:#FF6A3D !important;}
  @keyframes jstFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div style="background:#14263F;padding:16px clamp(16px,4vw,32px);display:flex;align-items:center;justify-content:space-between;gap:14px;">
  <div style="display:flex;align-items:center;gap:9px;">
    <span style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M2 18.5L7.5 9.5L11.5 18.5Z" fill="#FF6A3D" fill-opacity="0.5"/>
        <path d="M6.5 18.5L14 4.5L22 18.5Z" fill="#FF6A3D"/>
        <path d="M14 4.5L16.1 8.6L11.9 8.6Z" fill="#FFFFFF"/>
        <circle cx="18.7" cy="6.3" r="1.3" fill="#FFFFFF"/>
      </svg>
    </span>
    <span style="color:#FFFFFF;font-weight:800;font-size:15px;white-space:nowrap;">준스키타운 관리자</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" style="color:rgba(255,255,255,.7);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;">사이트로 돌아가기</a>
    <button id="logoutBtn" style="background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.85);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;">로그아웃</button>
  </div>
</div>

<main style="max-width:860px;margin:0 auto;padding:28px clamp(16px,4vw,32px) 60px;">
  <div style="margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <div>
      <div style="font-size:12.5px;font-weight:800;letter-spacing:.06em;color:#FF6A3D;text-transform:uppercase;margin-bottom:8px;">ADMIN</div>
      <h1 id="pageTitle" style="margin:0 0 8px;font-size:clamp(22px,4.5vw,28px);font-weight:800;color:#14263F;letter-spacing:-0.02em;"></h1>
      <p id="pageDesc" style="margin:0;font-size:14px;color:#4B5563;line-height:1.6;max-width:520px;"></p>
    </div>
    <span id="savedFlash" style="display:none;animation:jstFadeIn .18s ease both;flex:none;padding:8px 14px;border-radius:999px;background:#E9F7EF;color:#1F9254;font-weight:700;font-size:13px;white-space:nowrap;">✓ 저장됨</span>
  </div>

  <div id="tabBar" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;"></div>

  <div id="panel" style="background:#FFFFFF;border:1px solid #E6E8EC;border-radius:18px;padding:clamp(16px,4vw,22px);"></div>

  <div id="resetRow" style="margin-top:22px;">
    <button data-action="request-reset" style="padding:11px 18px;border-radius:11px;border:1.5px solid #E6E8EC;background:#FFFFFF;color:#8A93A1;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;">전체 품목 기본값으로 되돌리기</button>
  </div>
</main>

<div id="resetModal" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(20,38,63,.45);align-items:center;justify-content:center;padding:20px;">
  <div style="animation:jstFadeIn .18s ease both;width:min(92vw,360px);background:#FFFFFF;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;">
    <div>
      <div style="font-size:16px;font-weight:800;color:#14263F;margin-bottom:6px;">기본값으로 되돌릴까요?</div>
      <div style="font-size:13.5px;color:#4B5563;line-height:1.6;">리프트권·장비·의류·안전장비 전체 품목이 처음 상태로 되돌아가요.</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button data-action="cancel-reset" style="flex:1;padding:12px;border-radius:11px;border:1.5px solid #E6E8EC;background:#FFFFFF;color:#14263F;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;">취소</button>
      <button data-action="confirm-reset" style="flex:1;padding:12px;border-radius:11px;border:none;background:#E0483E;color:#FFFFFF;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;">되돌리기</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
